<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Meu Perfil Pessoal</title>
</head>
<body>
    <main>
        <div class="container" id="main-info">
            <header>
                <h1>Meu Perfil</h1>
            </header>
            <div class="photo">
                <img src="" alt="minha foto">
            </div>
            <div class="about">   
                <header>
                    <h2>Sobre</h2>
                </header>
                <p>minha descrição</p>
            </div>
        
        </div>


        <div class="info">
            <div class="container" id="skills">
                <header>
                    <h2>Habilidades</h2>
                </header>
                <p>minhas habilidades</p>
            </div>
            
            <div class="container" id="social-midia">
                <header>
                    <h2>Redes sociais</h2>
                </header>
                <p>minhas redes sociais</p>
            </div>
            
            <div class="container" id="resume">
                <header>
                    <h2>Baixe meu currículo</h2>
                </header>
                <p>currículo anexado</p>
            </div>
        </div> 
    </main>
</body>
</html>
